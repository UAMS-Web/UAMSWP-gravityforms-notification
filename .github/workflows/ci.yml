name: CI

# The checks this plugin runs on every pull request and on pushes to master.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the
# `checks` job. One definition serves every UAMS-Web repository, so this plugin does not
# carry a copy that drifts. The call switches on the two jobs only a plugin runs
# (`floor-lint`, `download-archive`), runs on Linux only, leaves mutation testing off, and
# runs the plugin's unit suite as `composer test:unit`. `phpcs` stays off: this plugin has no
# PHPCS configuration. The chain's own header lists every input and its default.
#
# `integration` stays here as a plain job beside the call, because its MySQL service and
# WordPress download are not in the chain (UAMS-Web/uams-claude-skills#607). It runs the
# Integration suite in single-site and multisite mode against an account that holds grants on
# one disposable database only, never `root`.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the
# call and `integration`, runs `if: always()`, and fails unless every needed job reports
# `success`: a `skipped` or `cancelled` job fails it. The call ends in a `Chain result` job that needs every job in
# the chain, so `checks` is `success` only when each of them succeeded. Adding a plain job
# here means adding it to the `needs:` list of `CI`; the `aggregate-needs` job in the chain
# fails the pull request when one is missing. Do not rename `CI`, and do not rename `checks`
# without changing `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts (including
# `pest-testing`, which the chain's `pest` job runs), the Composer scripts `test:pint`,
# `test:refactor`, `stan` and `test:unit`, and `scripts/lint-floor.php`.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.9.0
    with:
      linux-only: true
      mutate: false
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  integration:
    name: Integration (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [single, multisite]
    services:
      mysql:
        image: mysql:8.0
        # The image creates MYSQL_USER with every privilege on MYSQL_DATABASE and nothing else.
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: uamswp_gform_notification_tests
          MYSQL_USER: notification_test_runner
          MYSQL_PASSWORD: ci-disposable-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_ABSPATH: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_NAME: uamswp_gform_notification_tests
      WP_TESTS_DB_USER: notification_test_runner
      WP_TESTS_DB_PASSWORD: ci-disposable-test-password
      WP_MULTISITE: ${{ matrix.mode == 'multisite' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          integration: 'true'
      # The WordPress core copy the suite boots, matching wp-phpunit in
      # tests/Integration/composer.lock.
      - name: Download WordPress
        env:
          WP_VERSION: '7.1.3'
        run: |
          mkdir -p "$WP_TESTS_ABSPATH"
          curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz -C "$WP_TESTS_ABSPATH" --strip-components=1
      - run: composer test:integration

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and `integration`.
  ci:
    name: CI
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
