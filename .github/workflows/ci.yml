name: CI

# Remote gate for pull requests to `master`. Adapted from
# .claude/skills/code-quality/templates/ci.yml in UAMS-Web/uams-claude-skills.
#
# This repository is public, so Actions minutes are free and nothing here is gated on
# RUN_REMOTE_CI. The shared setup (PHP, the Composer cache, the locked install) is the
# composite action in .github/actions/setup, copied from the code-quality skill.
#
# Jobs present today: Composer lock freshness, the synced-files and no-emoji checks, the
# aggregate-needs check, the floor lint on PHP 8.2, Pint, Rector, PHPStan, and the Pest Unit
# suite. Not present yet, added with its own ticket: the Integration suite (needs a WordPress
# core copy and MySQL).
#
# The supported floor is PHP 8.2 and development runs on PHP 8.4: Pest 5 needs PHPUnit 13,
# which needs PHP 8.4.1. The setup action's default PHP is the development version; the
# floor is guarded by the lint-floor job, which parses every shipped file on PHP 8.2.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow. It `needs:`
# every other job in this file, runs `if: always()`, and fails unless every needed job reports
# `success`. Adding a job without adding it to that list leaves it running but not required;
# the aggregate-needs job fails the pull request when that happens. Do not rename `CI`.

on:
  pull_request:
  push:
    branches: [master]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  synced-files:
    name: Synced files (no hand-edited rules or skills)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  no-emoji:
    name: No emoji in durable records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, line and code point, when prose carries a banned glyph.
      - run: node .claude/skills/writing-comments/scripts/check-no-emoji.mjs

  aggregate-needs:
    name: Aggregate needs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job is missing from the `needs:` list of `CI` or a
      # fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  lint-floor:
    name: Floor lint (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Parses every shipped PHP file with the floor PHP. vendor/, tests/ and dot-folders
      # are left out: the suite runs only on the development PHP and may use its syntax.
      # xargs exits non-zero when any file fails to parse.
      - run: find . -path ./vendor -prune -o -path ./tests -prune -o -path './.*' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  pint:
    name: Pint (formatting)
    needs: [composer-validate, synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: composer test:pint

  rector:
    name: Rector (gating rules)
    needs: [composer-validate, synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: composer test:refactor

  phpstan:
    name: PHPStan (WordPress)
    needs: [composer-validate, synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # phpstan.neon.dist scans the Integration suite's WordPress test classes, which must
      # be installed first.
      - run: composer setup:integration

      - run: composer stan

  pest:
    name: Pest (Unit suite)
    needs: [composer-validate, synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The Unit suite needs no WordPress and no database. Pest 5 on PHPUnit 13.
      - run: composer test:unit

  # The one check a ruleset requires from this workflow. Keep `needs:` listing every other
  # job in the file.
  ci:
    name: CI
    needs: [composer-validate, synced-files, no-emoji, aggregate-needs, lint-floor, pint, rector, phpstan, pest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
